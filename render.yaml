# Static site: the dashboard needs no backend (pages read web/public/data/*.json).
services:
  - type: web
    name: superr-pressure-lab
    runtime: static
    buildCommand: npm install -g pnpm && cd web && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: web/out
    envVars:
      - key: NODE_VERSION
        value: 22
